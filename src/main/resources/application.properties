spring.application.name=alumnos

# ─── Base de datos ───────────────────────────────────────────────────────────
# En produccion (Render + Supabase) se usan variables de entorno.
# En local usa MySQL con los valores por defecto si no existen las variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/alumnos_tec}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1312}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=${SPRING_JPA_PLATFORM:org.hibernate.dialect.MySQLDialect}

# ─── Servidor ────────────────────────────────────────────────────────────────
# En Render el puerto lo asigna la plataforma via la variable PORT
server.address=0.0.0.0
server.port=${PORT:8081}